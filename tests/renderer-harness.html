<!doctype html><html><body style="margin:0"><canvas id="c" style="display:block;width:100vw;height:100vh"></canvas><script type="module">
import {ImplicitRenderer} from '../packages/render/src/index.js';import {compileDocument} from '../packages/compile/src/index.js';import {EXAMPLES} from '../app/examples.js';
window.errors=[];window.renderer=new ImplicitRenderer(document.querySelector('canvas'),{onError:e=>{window.errors.push(e.message);console.error(e);},onStatus:s=>window.statusInfo=s});
try{await renderer.init({forceWebGL:location.search.includes('webgl')});const d=EXAMPLES[0].make();renderer.setDomain(d.domain,{fit:true});await renderer.setProgram(compileDocument(d));window.ready=true;}catch(e){window.errors.push(e.stack);console.error(e);}
</script></body></html>
