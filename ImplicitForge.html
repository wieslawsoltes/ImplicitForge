<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16191f"><meta name="description" content="ImplicitForge — a browser-native implicit modeling, field-driven lattice design and engineering computation workbench."><title>ImplicitForge — Implicit Engineering</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f3975f'/%3E%3Cpath d='m16 5 10 6v10l-10 6L6 21V11l10-6Zm0 0v22M6 11l10 6 10-6' fill='none' stroke='%23171920' stroke-width='2'/%3E%3C/svg%3E"><style>:root {
    color-scheme:dark;
    --bg:#14171c;
    --panel:#1a1e25;
    --panel2:#20252e;
    --panel3:#252b35;
    --border:#303641;

}

* {
    box-sizing:border-box
}

html,body,#app {
    height:100%;
    width:100%;
    margin:0;
    overflow:hidden
}

body {
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font);
    font-size:12px;
    -webkit-font-smoothing:antialiased
}

button,input,select,textarea {
    font:inherit;
    color:inherit
}

button {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:30px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel2);
    padding:5px 10px;
    white-space:nowrap;
    cursor:pointer;
    transition:background .13s,border-color .13s,box-shadow .13s
}

button:hover {
    background:var(--panel3);
    border-color:#5a6474
}

button:active {
    transform:translateY(.5px)
}

button:disabled {
    opacity:.35;

}

button.primary {
    background:var(--accent);
    color:#251a14;
    border-color:var(--accent);
    font-weight:650
}

button.primary:hover {

}

button.subtle {
    border-color:transparent;
    background:transparent;
    color:var(--muted)
}

button.subtle:hover {
    background:var(--panel2);
    color:var(--fg)
}

button.icon-button {
    width:30px;
    height:30px;
    padding:5px;
    background:transparent;
    border-color:transparent;
    flex-shrink:0
}

button.icon-button:hover {
    border-color:var(--border);
    background:var(--panel3)
}

button.active {
    color:var(--accent);
    background:var(--accent-dim);
    border-color:#9f6849
}

button svg {
    flex-shrink:0
}

input,select,textarea {
    border:1px solid var(--border);
    background:var(--input);
    border-radius:5px;
    outline:0;
    min-width:0;
    padding:7px 8px
}

input:focus,select:focus,textarea:focus {
    border-color:var(--accent);
    box-shadow:0 0 0 2px #ef986919
}

button:focus-visible,[tabindex]:focus-visible {
    outline:2px solid var(--accent);
    outline-offset:2px
}

input[type=number] {

    font-size:11px;
    font-variant-numeric:tabular-nums;
    width:100%
}

input[type=range] {
    accent-color:var(--accent);
    height:20px;
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
    width:100%;

}

input[type=color] {
    padding:2px;
    min-height:30px;
    width:42px;

}

input[type=checkbox] {

select {

    max-width:100%;

a {

h1,h2,h3,p {

}

h2 {

h3 {

.mono {

.muted {

.caption {

}

.notebook-label {

.notebook-index {

.sidebar-bottom {

.domain-card small {

.domain-button {

.center {

    background-color:#15191f;
    background-image:radial-gradient(circle,#46506380 .7px,transparent .9px);
    background-size:20px 20px
}

.graph-world {
    position:absolute;
    left:0;
    top:0;
    transform-origin:0 0;
    width:1px;
    height:1px
}

.graph-edges {
    position:absolute;
    left:0;
    top:0;
    width:1px;
    height:1px;
    overflow:visible;
    pointer-events:none
}

.edge {
    fill:none;
    stroke:#9e7962;
    stroke-width:1.45;
    opacity:.75
}

.edge.scalar {
    stroke:#899951
}

.edge.pending {
    stroke:var(--accent);
    stroke-dasharray:5 4;
    opacity:1
}

.graph-node {
    position:absolute;
    width:205px;
    background:#242a33;
    border:1px solid #444c59;
    border-radius:6px;
    box-shadow:0 5px 13px #0003;
    cursor:default;
    user-select:none
}

.graph-node.selected {
    border-color:var(--accent);
    box-shadow:0 0 0 1px #ef986930,0 5px 13px #0003
}

.graph-node.invalid {
    border-color:#9f5150
}

.node-header {
    height:40px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 13px 0 11px;
    cursor:grab;
    position:relative;
    border-bottom:1px solid #39404c
}

.node-glyph {
    color:#9aadc3;
    flex-shrink:0;
    display:flex
}

.node-title {
    font-size:11px;
    font-weight:550;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}

.node-output-label {
    font:7px var(--mono);
    color:var(--green);
    margin-left:auto
}

.graph-node.lattices .node-glyph {
    color:var(--accent)
}

.graph-node.fields .node-glyph {
    color:var(--field)
}

.node-type {
    height:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px;
    font-size:8px;
    color:#8594a8;
    letter-spacing:.04em
}

.node-type span {
    font:8px var(--mono);
    color:#67788b
}

.node-inputs {
    padding-bottom:7px
}

.node-input {
    height:22px;
    position:relative;
    display:flex;
    align-items:center;
    padding:0 12px;
    font-size:9px;
    color:#bac4d3
}

.node-input i {
    font-size:8px;
    font-style:normal;
    color:#6f7e92;
    margin-left:auto
}

.node-input i.required {
    color:#ac7771
}

.port {
    padding:0;
    min-height:0;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#242a33;
    border:2px solid #b98e70;
    position:absolute;
    z-index:2;
    cursor:crosshair
}

.port:hover {
    transform:scale(1.5);
    border-color:var(--accent);
    background:var(--accent)
}

.port.output {
    right:-5px;
    top:18px;
    background:#c88b63
}

.port.input {
    left:-5px;
    top:6px
}

.port.scalar {
    border-color:#a4b873
}

.port.output.scalar,.port.scalar.connected {
    background:#a4b873
}

.port.body.connected {
    background:#c88b63
}

.graph-footer {
    height:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    border-top:1px solid var(--border-soft);
    color:var(--faint);
    font-size:8px;
    flex-shrink:0
}

.graph-footer span:last-child {
    font-family:var(--mono)
}

.graph-empty {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--faint);
    font-size:11px;
    pointer-events:none
}

.inspector-tabs {
    height:43px;
    display:flex;
    gap:20px;
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0
}

.inspector-tabs button {
    height:100%;
    padding:0;
    background:none;
    border:0;
    border-bottom:2px solid transparent;
    border-radius:0;
    color:var(--faint);
    font-size:10px
}

.inspector-tabs button.active {
    color:var(--fg);
    border-bottom-color:var(--accent)
}

.inspector-content {
    overflow:auto;
    min-height:0;
    flex:1;
    padding:0 16px 20px
}

.inspector-identity {
    padding:19px 0 17px;
    border-bottom:1px solid var(--border-soft)
}

.inspector-identity .identity-row {
    display:flex;
    gap:9px;
    align-items:center
}

.identity-glyph {
    height:31px;
    width:31px;
    background:#342b25;
    border:1px solid #644936;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    flex-shrink:0
}

.inspector-title {
    display:block;
    font-size:14px;
    font-weight:550;
    letter-spacing:-.2px;
    width:100%;
    padding:3px 0;
    background:transparent;
    border-color:transparent;
    border-radius:3px
}

.inspector-title:focus {
    background:var(--input);
    padding:3px
}

.identity-subtitle {
    color:var(--faint);
    font-size:9px;
    margin-top:4px
}

.identity-actions {
    display:flex;
    gap:6px;
    margin-top:13px;
    align-items:center
}

.identity-actions button {
    font-size:9px;
    min-height:25px;
    padding:4px 7px
}

.identity-actions .icon-button {
    width:25px;
    height:25px;
    padding:4px;
    margin-left:auto
}

.inspector-section {
    padding:16px 0 5px;
    border-bottom:1px solid var(--border-soft)
}

.inspector-section:last-child {
    border-bottom:0
}

.inspector-section>.caption {
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--muted);
    font-size:8px;
    letter-spacing:.12em
}

.control {
    margin-bottom:16px
}

.control>label,.control-label {
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:10px;
    color:#aeb8c8;
    margin-bottom:7px;
    gap:5px
}

.control .unit {
    color:var(--faint);
    font-size:9px;
    font-family:var(--mono)
}

.control>select {
    width:100%;
    height:31px
}

.number-and-slider {
    display:grid;
    grid-template-columns:minmax(0,1fr) 66px;
    align-items:center;
    gap:10px
}

.number-and-slider input[type=number] {
    text-align:right;
    padding:7px 6px;
    font-size:10px
}

.vector-control {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px
}

.vector-value {
    position:relative
}

.vector-value span {
    position:absolute;
    left:7px;
    top:8px;
    font:9px var(--mono);
    color:var(--faint)
}

.vector-value input {
    padding:7px 5px 7px 21px;
    text-align:right;
    font-size:10px
}

.control-note {
    font-size:9px;
    color:var(--faint);
    line-height:1.6;
    margin-top:8px
}

.driven-note {
    color:var(--field);
    font:8px var(--mono);
    display:flex;
    align-items:center;
    gap:4px
}

.input-link {
    position:relative
}

.input-link select {
    padding-left:25px
}

.input-link>.port-dot {
    position:absolute;
    left:10px;
    top:11px;
    width:7px;
    height:7px;
    border:1.5px solid #ad8060;
    border-radius:50%;
    pointer-events:none
}

.input-link>.port-dot.scalar {
    border-color:var(--field)
}

.input-link>.port-dot.connected {
    background:currentColor;
    color:#ad8060
}

.input-link>.port-dot.scalar.connected {
    color:var(--field)
}

.inspector-description {
    color:var(--faint);
    font-size:10px;
    line-height:1.7;
    margin:13px 0
}

.inline-warning {
    padding:10px 11px;
    background:#49382855;
    border:1px solid #7a5f3755;
    color:#c1a57e;
    font-size:9px;
    line-height:1.7;
    border-radius:5px;
    margin:10px 0
}

.inline-warning.error {
    background:#48282b66;
    border-color:#8b464755;
    color:#e3a3a2
}

.parameter-footer {
    display:flex;
    gap:7px;
    margin-top:15px
}

.parameter-footer button {
    font-size:9px;
    min-height:27px;
    padding:4px 7px
}

.material-row {
    display:flex;
    gap:7px
}

.material-row select {
    width:100%;
    flex:1;
    font-size:10px
}

.property-list {
    display:grid;
    grid-template-columns:1fr auto;
    gap:9px 10px;
    margin:12px 0;
    font-size:10px;
    color:var(--muted)
}

.property-list dt {
    color:var(--faint)
}

.property-list dd {
    margin:0;
    font:10px var(--mono);
    text-align:right;
    color:var(--muted)
}

.property-list .good {
    color:var(--green)
}

.property-list .bad {
    color:var(--danger)
}

.field-curve {
    width:100%;
    height:65px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:5px;
    margin:9px 0 2px
}

.field-description {
    font-size:10px;
    color:var(--muted);
    line-height:1.7
}

.analysis-lead {
    padding:18px 0 15px
}

.analysis-lead h3 {
    font-size:14px;
    font-weight:530
}

.analysis-lead p {
    font-size:10px;
    line-height:1.65;
    color:var(--faint);
    margin-top:7px
}

.analysis-mode-select {
    width:100%;
    height:34px;
    margin-bottom:4px
}

.analysis-form {
    padding:12px 0 0
}

.analysis-form .control {
    margin-bottom:13px
}

.analysis-form button.primary {
    margin-top:4px;
    min-height:33px;
    font-size:10px
}

.analysis-results {
    padding-top:15px
}

.analysis-results h3 {
    font-size:11px;
    margin-bottom:9px
}

.result-banner {
    padding:9px 10px;
    border:1px solid #719a7250;
    background:#24332877;
    color:var(--green);
    border-radius:4px;
    font-size:10px;
    margin:12px 0
}

.result-banner.warning {
    background:#49382755;
    color:var(--accent);
    border-color:#bd784b66
}

.result-table {
    border-collapse:collapse;
    width:100%;
    font-size:9px;
    margin:12px 0
}

.result-table th {
    text-align:left;
    padding:7px 6px;
    border-bottom:1px solid var(--border);
    color:var(--faint);
    font-weight:500
}

.result-table td {
    padding:6px;
    border-bottom:1px solid var(--border-soft);
    font-family:var(--mono);
    color:var(--muted)
}

.sweep-chart {
    width:100%;
    height:110px;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--input)
}

.statusbar {
    height:27px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 13px;
    background:#161a20;
    border-top:1px solid var(--border);
    font-size:9px;
    color:var(--faint);
    flex-shrink:0
}

.statusbar .engine {
    color:var(--muted);
    display:flex;
    gap:6px;
    align-items:center;
    font-size:9px
}

.statusbar .separator {
    width:1px;
    height:10px;
    background:var(--border);
    margin:0 7px
}

.statusbar .status-right {
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px
}

.statusbar .icon-button {
    height:22px;
    min-height:22px;
    width:23px;
    padding:4px;
    color:var(--faint)
}

.statusbar .unit-pill {
    border:1px solid var(--border);
    padding:1px 4px;
    border-radius:3px;
    font:8px var(--mono)
}

.job-bar {
    position:absolute;
    bottom:calc(var(--graph-height) + 18px);
    left:50%;
    transform:translateX(-50%);
    width:min(410px,88%);
    padding:13px 15px;
    background:#1d2633ee;
    border:1px solid #66758b88;
    border-radius:9px;
    box-shadow:0 8px 30px #0007;
    backdrop-filter:blur(16px);
    z-index:10;
    color:#dae4ef
}

.job-bar .row {
    justify-content:space-between;
    font-size:10px
}

.job-bar .row strong {
    font-weight:500
}

.job-bar button {
    min-height:20px;
    border:0;
    background:transparent;
    font-size:9px;
    padding:2px 4px;
    color:#9eaec3
}

.progress-track {
    height:3px;
    background:#384458;
    margin-top:10px;
    border-radius:3px;
    overflow:hidden
}

.progress-fill {
    height:100%;
    background:var(--accent);
    width:0;
    transition:width .1s
}

.job-details {
    font:8px var(--mono);
    color:#8192a9;
    margin-top:7px;
    min-height:9px
}

.toasts {
    position:fixed;
    right:18px;
    bottom:41px;
    z-index:1000;
    display:flex;
    align-items:flex-end;
    flex-direction:column;
    gap:8px;
    max-width:min(470px,calc(100vw - 36px));
    pointer-events:none
}

.toast {
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel2);
    border:1px solid #526078;
    color:var(--fg);
    box-shadow:0 8px 24px #0005;
    border-radius:7px;
    padding:12px 13px;
    pointer-events:auto;
    font-size:11px;
    line-height:1.6;
    animation:toast-in .15s ease-out
}

.toast>svg {
    color:var(--accent);
    flex-shrink:0
}

.toast.success>svg {
    color:var(--green)
}

.toast.error {
    border-color:#9b6265
}

.toast.error>svg {
    color:var(--danger)
}

.toast button {
    border:0;
    background:none;
    min-height:20px;
    width:20px;
    padding:0;
    color:var(--muted);
    margin-left:8px;
    align-self:flex-start
}

@keyframes toast-in {
    from {
        opacity:0;
        transform:translateY(7px)
    }

    to {
        opacity:1;
        transform:none
    }

}

dialog {
    border:1px solid #515c6f;
    border-radius:12px;
    background:var(--panel);
    color:var(--fg);
    box-shadow:0 25px 120px #0009;
    padding:0;
    width:min(530px,calc(100vw - 32px));
    max-height:calc(100vh - 50px);
    overflow:hidden
}

dialog.wide {
    width:min(850px,calc(100vw - 40px))
}

dialog::backdrop {
    background:#070b12ab;
    backdrop-filter:blur(5px)
}

.dialog-header {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1px solid var(--border);
    padding:22px 23px 18px;
    gap:14px
}

.dialog-header p {
    margin-top:8px;
    font-size:11px;
    color:var(--muted);
    line-height:1.5
}

.dialog-body {
    padding:21px 23px 24px;
    overflow:auto;
    max-height:calc(100vh - 170px)
}

.dialog-actions {
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:20px
}

.dialog-copy {
    font-size:12px;
    color:var(--muted);
    line-height:1.8
}

.dialog-search {
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:19px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:6px;
    padding:0 11px
}

.dialog-search input {
    background:transparent;
    border:0;
    box-shadow:none;
    width:100%;
    height:37px;
    padding:7px 0
}

.dialog-search svg {
    color:var(--faint)
}

.category-filters {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:17px
}

.category-filters button {
    font-size:10px;
    min-height:26px;
    padding:3px 8px
}

.library-grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:9px
}

.library-card {
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    white-space:normal;
    text-align:left;
    gap:10px;
    padding:13px 11px;
    min-height:76px;
    background:var(--panel2)
}

.library-card svg {
    color:var(--accent);
    margin-top:2px
}

.library-card strong {
    font-size:11px;
    display:block;
    font-weight:550
}

.library-card small {
    display:block;
    color:var(--faint);
    font-size:9px;
    line-height:1.5;
    margin-top:5px
}

.examples-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
}

.example-card {
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:15px;
    white-space:normal;
    text-align:left;
    padding:20px 17px;
    background:linear-gradient(130deg,var(--panel3),var(--panel));
    min-height:119px;
    overflow:hidden
}

.example-card:before {
    content:'';
    position:absolute;
    right:-15px;
    top:-22px;
    width:100px;
    height:100px;
    border:1px solid #697b9130;
    transform:rotate(30deg);
    border-radius:19px;
    pointer-events:none
}

.example-card svg {
    color:var(--accent);
    width:27px;
    height:27px;
    margin-top:19px
}

.example-card small {
    font-size:7px;
    color:var(--faint);
    letter-spacing:.11em;
    display:block;
    margin:2px 0 9px
}

.example-card strong {
    font-size:12px;
    font-weight:550;
    display:block
}

.example-card p {
    font-size:10px;
    color:var(--muted);
    line-height:1.7;
    margin-top:6px
}

.form-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 16px
}

.form-grid .span2 {
    grid-column:1/-1
}

.export-options {
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
    margin:12px 0 21px
}

.export-options button {
    height:61px;
    display:flex;
    flex-direction:column;
    gap:5px;
    font:12px var(--mono)
}

.export-options button small {
    font:8px var(--font);
    color:var(--faint)
}

.export-options button.active small {
    color:var(--accent)
}

.code-block {
    white-space:pre;
    overflow:auto;
    max-height:450px;
    margin:14px 0 0;
    padding:17px;
    font:10px/1.7 var(--mono);
    background:var(--input);
    border:1px solid var(--border);
    border-radius:5px;
    color:#a6bdcf
}

.commands-list {
    display:flex;
    flex-direction:column;
    gap:4px
}

.command-item {
    justify-content:flex-start;
    background:none;
    border-color:transparent;
    min-height:39px;
    padding:8px 10px;
    text-align:left
}

.command-item kbd {
    margin-left:auto;
    color:var(--faint);
    font:10px var(--mono)
}

.help-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px
}

.help-grid h3 {
    color:var(--accent);
    font-weight:500;
    margin-bottom:12px
}

.help-grid p {
    line-height:1.8;
    font-size:11px;
    color:var(--muted)
}

.help-grid dl {
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    font-size:11px
}

.help-grid dt {
    color:var(--muted)
}

.help-grid dd {
    margin:0;
    font:10px var(--mono);
    color:var(--fg)
}

.help-boundary {
    grid-column:1/-1;
    border-top:1px solid var(--border);
    padding-top:16px
}

.boot {
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    flex-direction:column;
    gap:15px;
    color:var(--muted)
}

.boot h1 {
    font-size:22px;
    font-weight:500;
    color:var(--fg)
}

.boot p {
    font-size:12px
}

.boot-mark {
    font-size:52px;
    font-style:italic;
    color:var(--accent)
}

:root[data-theme=light] {
    color-scheme:light;
    --bg:#e7e9ed;
    --panel:#f5f6f8;
    --panel2:#e9edf2;
    --panel3:#e0e6ef;
    --border:#cbd2dd;
    --border-soft:#dce1e8;
    --fg:#293649;
    --muted:#65748a;
    --faint:#8692a3;
    --accent:#ad552a;
    --accent-dim:#f3dfd0;
    --green:#2a8864;
    --field:#5a7f30;
    --input:#fff;
    --danger:#bf4b4b
}

:root[data-theme=light] .topbar,:root[data-theme=light] .statusbar {
    background:#f4f6f9
